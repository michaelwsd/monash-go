name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: backend

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # main.py builds Settings at import time, so the app is unimportable without
      # config. Using .env.sample means CI fails if a new Settings field is added
      # without documenting it there.
      - name: Create .env from sample
        run: cp .env.sample .env

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy src tests scripts

      - name: Test
        run: uv run pytest
