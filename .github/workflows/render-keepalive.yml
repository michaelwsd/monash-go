name: Render Keep Alive

on:
  schedule:
    # Render's free instance spins down after 15 minutes without a request and
    # takes a minute or more to come back, during which every page load hangs.
    # Ten minutes leaves slack for GitHub's best-effort scheduler, which
    # routinely runs late. Render allows 750 free instance hours a month, and a
    # single always-on service uses about 720, so this fits, but it is the whole
    # allowance: a second free service on the same account would not.
    - cron: '*/10 * * * *'
  workflow_dispatch:

# A run already in flight is enough; never stack them.
concurrency:
  group: render-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the API health endpoint
        run: |
          set -euo pipefail

          # /health reads settings and nothing else, so a 200 means the process
          # is up and configured. Retries cover a cold start that is already in
          # progress when this fires.
          body=$(curl -fsS \
            --retry 5 --retry-delay 15 --retry-all-errors \
            --max-time 60 \
            https://monashgo-api.onrender.com/health)

          echo "Response: ${body}"

          if ! echo "${body}" | jq -e '.status == "ok"' >/dev/null; then
            echo "::error::Health check returned an unexpected body."
            exit 1
          fi

          echo "API responded. Instance is awake."
