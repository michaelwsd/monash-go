services:
  - type: web
    name: monashgo-api
    runtime: python
    rootDir: backend
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: ENVIRONMENT
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: CLERK_PEM_PUBLIC_KEY
        sync: false
      - key: CLERK_ISSUER
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: SERVO_SAVER_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
